<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álgebra: Variables y Expresiones</title>
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #50E3C2;
            --dark: #333333;
            --light: #F4F7F6;
            --correct: #2ECC71;
            --incorrect: #E74C3C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #666;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }

        /* Menu */
        .menu-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .menu-btn:hover, .menu-btn:active {
            background-color: #357ABD;
        }

        /* Quiz */
        #quiz-section {
            display: none;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background-color: white;
            color: var(--dark);
            border: 2px solid var(--primary);
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background-color: #e8f0fe;
        }

        .option-btn.correct {
            background-color: var(--correct);
            border-color: var(--correct);
            color: white;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect);
            border-color: var(--incorrect);
            color: white;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 25px;
        }

        .nav-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: var(--dark);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
        }

        .back-btn {
            background-color: transparent;
            color: var(--primary);
            border: none;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
            text-decoration: underline;
        }

        #score-section {
            display: none;
        }

        .score-text {
            font-size: 1.5rem;
            color: var(--primary);
            margin: 20px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Variables, Expresiones y Traducción</h1>
        <p class="subtitle">Práctica Generativa - Álgebra</p>
    </header>

    <div class="container" id="menu-section">
        <h2>Selecciona un tema:</h2>
        <br>
        <button class="menu-btn" onclick="startQuiz('traduccion')">1. Traducción al Lenguaje Algebraico</button>
        <button class="menu-btn" onclick="startQuiz('identificacion')">2. Términos y Coeficientes</button>
        <button class="menu-btn" onclick="startQuiz('simplificacion')">3. Simplificación de Expresiones</button>
        <button class="menu-btn" onclick="startQuiz('evaluacion')">4. Evaluación de Expresiones</button>
    </div>

    <div class="container" id="quiz-section">
        <div id="progress-text" style="color: #888; font-size: 0.9rem; margin-bottom: 10px;"></div>
        <div class="question-text" id="question"></div>
        <div id="options-container"></div>
        <div class="feedback" id="feedback"></div>
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Siguiente</button>
        <br>
        <button class="back-btn" onclick="returnToMenu()">Volver al Menú</button>
    </div>

    <div class="container" id="score-section">
        <h2>¡Práctica Completada!</h2>
        <div class="score-text" id="final-score"></div>
        <p id="score-message"></p>
        <br>
        <button class="menu-btn" onclick="returnToMenu()">Volver al Menú Principal</button>
    </div>

    <script>
        let currentQuizData = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const menuSection = document.getElementById('menu-section');
        const quizSection = document.getElementById('quiz-section');
        const scoreSection = document.getElementById('score-section');
        const questionEl = document.getElementById('question');
        const optionsContainer = document.getElementById('options-container');
        const feedbackEl = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('progress-text');

        // Función auxiliar para obtener números aleatorios sin repetir
        function getUniqueRandoms(count, min, max) {
            let nums = new Set();
            while(nums.size < count) {
                nums.add(Math.floor(Math.random() * (max - min + 1)) + min);
            }
            return Array.from(nums);
        }

        // Generador dinámico de preguntas
        function generateQuestions(category) {
            let questions = [];
            for (let i = 0; i < 10; i++) {
                let r = getUniqueRandoms(4, 2, 9);
                let a = r[0], b = r[1], c = r[2];
                let type = Math.floor(Math.random() * 5);
                let q, ans, w1, w2, w3;

                if (category === 'traduccion') {
                    if(type === 0) { q=`El doble de un número más ${a}`; ans=`2x + ${a}`; w1=`x/2 + ${a}`; w2=`2(x + ${a})`; w3=`x + 2 + ${a}`; }
                    else if(type === 1) { q=`Un número disminuido en ${b}`; ans=`x - ${b}`; w1=`${b} - x`; w2=`${b}x`; w3=`x / ${b}`; }
                    else if(type === 2) { q=`El triple de la suma de un número y ${c}`; ans=`3(x + ${c})`; w1=`3x + ${c}`; w2=`x + 3(${c})`; w3=`3x - ${c}`; }
                    else if(type === 3) { q=`La mitad de un número aumentada en ${a}`; ans=`x/2 + ${a}`; w1=`2x + ${a}`; w2=`x/2 - ${a}`; w3=`(x + ${a})/2`; }
                    else { q=`El cuádruple de un número menos ${b}`; ans=`4x - ${b}`; w1=`4(x - ${b})`; w2=`${b}x - 4`; w3=`x/4 - ${b}`; }
                }
                else if (category === 'identificacion') {
                    if(type === 0) { q=`En la expresión '${a}x + ${b}', ¿cuál es el coeficiente?`; ans=`${a}`; w1=`${b}`; w2=`x`; w3=`${a+b}`; }
                    else if(type === 1) { q=`En la expresión '${a}y - ${b}', ¿cuál es la constante?`; ans=`-${b}`; w1=`${a}`; w2=`y`; w3=`${b}`; }
                    else if(type === 2) { q=`¿Cuántos términos tiene la expresión '${a}x² - ${b}x + ${c}'?`; ans=`3`; w1=`1`; w2=`2`; w3=`4`; }
                    else if(type === 3) { q=`Identifica los términos semejantes: '${a}x + ${b}y - ${c}x'`; ans=`${a}x y -${c}x`; w1=`${a}x y ${b}y`; w2=`${b}y y -${c}x`; w3=`Todos son semejantes`; }
                    else { q=`En la expresión 'x + ${a}', ¿cuál es el coeficiente de x?`; ans=`1`; w1=`0`; w2=`${a}`; w3=`No tiene`; }
                }
                else if (category === 'simplificacion') {
                    if(type === 0) { q=`Simplifica: ${a}x + ${b}x`; ans=`${a+b}x`; w1=`${a*b}x`; w2=`${Math.abs(a-b)}x`; w3=`${a+b}x²`; }
                    else if(type === 1) { q=`Simplifica: ${a}y - ${b}y + y`; ans=`${a-b+1}y`; w1=`${a-b}y`; w2=`${a-b-1}y`; w3=`${a+b+1}y`; }
                    else if(type === 2) { q=`Aplica la propiedad distributiva: ${a}(x + ${b})`; ans=`${a}x + ${a*b}`; w1=`${a}x + ${b}`; w2=`x + ${a*b}`; w3=`${a+b}x`; }
                    else if(type === 3) { q=`Aplica la propiedad distributiva: ${a}(y - ${b})`; ans=`${a}y - ${a*b}`; w1=`${a}y - ${b}`; w2=`${a}y + ${a*b}`; w3=`${a-b}y`; }
                    else { q=`Combina términos: ${a+c}a + ${b} - ${c}a`; ans=`${a}a + ${b}`; w1=`${a+2*c}a + ${b}`; w2=`${a}a - ${b}`; w3=`${a+b}a`; }
                }
                else if (category === 'evaluacion') {
                    let x = Math.floor(Math.random() * 4) + 2;
                    let y = Math.floor(Math.random() * 4) + 2;
                    if(type === 0) { q=`Evalúa '${a}x + ${b}' si x = ${x}`; ans=`${a*x + b}`; w1=`${a*x - b}`; w2=`${a+x+b}`; w3=`${a*x}`; }
                    else if(type === 1) { q=`Evalúa '${a}y - ${b}' si y = ${y}`; ans=`${a*y - b}`; w1=`${a*y + b}`; w2=`${a+y-b}`; w3=`${a*b - y}`; }
                    else if(type === 2) { q=`Evalúa 'x² + ${a}' si x = ${x}`; ans=`${x*x + a}`; w1=`${2*x + a}`; w2=`${x*x - a}`; w3=`${x*a}`; }
                    else if(type === 3) { q=`Evalúa '${a}x + y' si x = ${x} e y = ${y}`; ans=`${a*x + y}`; w1=`${a*y + x}`; w2=`${a*(x+y)}`; w3=`${x+y}`; }
                    else { q=`Evalúa '${a}(x + ${b})' si x = ${x}`; ans=`${a*(x+b)}`; w1=`${a*x + b}`; w2=`${x+b}`; w3=`${a+x+b}`; }
                }

                // Generar array de opciones y evitar duplicidades absolutas
                let optionsArray = [ans.toString(), w1.toString(), w2.toString(), w3.toString()];
                optionsArray = [...new Set(optionsArray)];
                while(optionsArray.length < 4) {
                    optionsArray.push((Math.floor(Math.random() * 50) + 10).toString());
                    optionsArray = [...new Set(optionsArray)];
                }
                
                // Mezclar opciones
                let shuffled = [...optionsArray];
                for (let j = shuffled.length - 1; j > 0; j--) {
                    const k = Math.floor(Math.random() * (j + 1));
                    [shuffled[j], shuffled[k]] = [shuffled[k], shuffled[j]];
                }
                
                questions.push({ q: q, options: shuffled, a: shuffled.indexOf(ans.toString()) });
            }
            return questions;
        }

        function startQuiz(category) {
            currentQuizData = generateQuestions(category); // Genera 10 preguntas nuevas
            currentQuestionIndex = 0;
            score = 0;
            menuSection.style.display = 'none';
            scoreSection.style.display = 'none';
            quizSection.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            feedbackEl.innerText = '';
            feedbackEl.style.color = '';
            nextBtn.style.display = 'none';
            optionsContainer.innerHTML = '';

            const currentQuestion = currentQuizData[currentQuestionIndex];

            progressText.innerText = `Pregunta ${currentQuestionIndex + 1} de ${currentQuizData.length}`;
            questionEl.innerText = currentQuestion.q;

            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.classList.add('option-btn');
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, selectedBtn) {
            if (answered) return; 
            answered = true;

            const currentQuestion = currentQuizData[currentQuestionIndex];
            const correctIndex = currentQuestion.a;
            const allBtns = optionsContainer.children;

            if (selectedIndex === correctIndex) {
                selectedBtn.classList.add('correct');
                feedbackEl.innerText = '¡Correcto! 🎉';
                feedbackEl.style.color = 'var(--correct)';
                score++;
            } else {
                selectedBtn.classList.add('incorrect');
                allBtns[correctIndex].classList.add('correct'); 
                feedbackEl.innerText = 'Incorrecto. La respuesta era: ' + currentQuestion.options[correctIndex];
                feedbackEl.style.color = 'var(--incorrect)';
            }

            for (let btn of allBtns) {
                btn.style.cursor = 'default';
            }

            nextBtn.style.display = 'inline-block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizSection.style.display = 'none';
            scoreSection.style.display = 'block';
            
            const total = currentQuizData.length;
            document.getElementById('final-score').innerText = `${score} / ${total}`;
            
            const messageEl = document.getElementById('score-message');
            if(score === total) {
                messageEl.innerText = "¡Excelente! Dominas este tema perfectamente.";
            } else if(score >= total / 2) {
                messageEl.innerText = "¡Buen trabajo! Sigue practicando para alcanzar la perfección.";
            } else {
                messageEl.innerText = "No te rindas. Revisa los conceptos y vuelve a intentarlo.";
            }
        }

        function returnToMenu() {
            quizSection.style.display = 'none';
            scoreSection.style.display = 'none';
            menuSection.style.display = 'block';
        }
    </script>
</body>
</html>
